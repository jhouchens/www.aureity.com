<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Web page CSS -->
    <link rel="stylesheet" href="assets/css/styles.css" />

    <!-- Simple lightbox CSS -->
    <link rel="stylesheet" href="assets/css/simple-lightbox.min.css" />

    <!-- Favicons -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="assets/icons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/svg"
      sizes="32x32"
      href="assets/icons/favicon-32x32.svg"
    />
    <link
      rel="icon"
      type="image/svg"
      sizes="16x16"
      href="assets/icons/favicon-16x16.svg"
    />

    <title>Welcome to Aureity</title>
  </head>
  <body>
    <!-- header -->
    <header class="header">

      <!-- Logo -->  
      <a href="#" class="logo">
          <div class="logo-icon">
              <div class="logo-circle"></div>
              <div class="logo-bead"></div>
          </div>
          <div class="logo-text">
              <span class="logo-text1">Aureity</span>
          </div>
      </a>

      <!-- Menu Items --> 
      <nav class="nav-bar">  
        <ul class="nav-menu">
            <li class="nav-item">
            <a href="about" class="nav-link" id="nav-link">Who we are</a>
            </li>
            <li class="nav-item">
            <a href="our-work" class="nav-link" id="nav-link">What we do</a>
            </li>
            <li class="nav-item">
            <a href="contact" class="nav-link" id="nav-link"
                >Contact us</a>
            </li>
        </ul>
      </nav>

      <div class="header-right">
        <!-- Dark/light theme switcher -->       
        <div class="theme-switch">
            <input type="checkbox" class="checkbox" id="checkbox" />
            <label for="checkbox" class="label">
                <ion-icon name="sunny-outline" class="sun"></ion-icon>
                <ion-icon name="moon-outline" class="moon"></ion-icon>
                <div class="switcher"></div>
            </label>
        </div>
  
        <!-- Hamburger menu -->
        <div class="hamburger" id="hamburger">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div> 
      </div>
    </header>

    <section id="hero-section" class="hero-section">

      <div id="hero-box" class="hero-box">
        <ion-button class="hero-box-close-btn">
          <ion-icon slot="icon-only" size="large" name="close-circle-outline"></ion-icon>
        </ion-button>
        <div id="hero-content" class="hero-content"></div>
      </div>

    </section>

    <!-- Social icons -->
<!--
    <section class="social">
      <h3>Connect with us on Social Media</h3>
      <div class="socicons">
        <a href="#"> <ion-icon name="logo-twitter"></ion-icon> </a>
        <a href="#"> <ion-icon name="logo-instagram"></ion-icon> </a>
        <a href="#"> <ion-icon name="logo-facebook"></ion-icon> </a>
      </div>
    </section>
-->
    <!-- Copyright Notice Footer-->
    <footer>
      <span class="copyright-notice">&copy; <span id="year"></span> Aureity, Incorported. All Rights Reserved</span>
    </footer>

    <!-- Web page script -->
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script src="assets/js/app.js"></script>

    <!-- Ion icons CDN -->

    <script
      type="module"
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"
    ></script>

    <script>
        document.getElementById("year").textContent = new Date().getFullYear();
    </script>


  </body>
</html>
